<!doctype html>
<html lang="en-GB">
    <head>
        <meta charset="utf-8" />
        <title>Linechart verification</title>
        <style>
            body {
                margin: 0;
                font-family: Helvetica, Arial, sans-serif;
                background: #f5f5f5;
            }
            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                padding: 8px;
            }
            .cell {
                background: #fff;
                height: 320px;
                display: flex;
                flex-direction: column;
            }
            .cell > h4 {
                margin: 4px 8px;
                font-size: 12px;
                color: #666;
            }
            .cell > div {
                flex: 1;
                min-height: 0;
            }
            .cell > div > * {
                display: block;
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <div class="grid" id="demo"></div>

        <script type="module">
            import { render } from 'lit'
            import { html, unsafeStatic } from 'lit/static-html.js'
            import packageJson from '../package.json'
            const tag = unsafeStatic(`widget-linechart-${packageJson.version}`)
            import '../src/widget-linechart.ts'
            import defaultData from '../src/default-data.json'
            import themeObject from './themes/light.json'
            const theme = { theme_name: 'light', theme_object: themeObject }

            // The case from the incident: frequency distribution over four
            // machine programs, no time axis, value labels requested.
            const programs = (orientation, showValueLabels) => ({
                title: 'Program frequency',
                axis: {
                    timeseries: false,
                    orientation,
                    showLegend: false,
                    xAxisLabel: 'Program',
                    yAxisLabel: 'Runs'
                },
                dataseries: [
                    {
                        label: 'Runs',
                        type: 'bar',
                        borderColor: '#4472c4',
                        backgroundColor: '#4472c4',
                        styling: { showValueLabels },
                        data: [
                            { x: 'Vollwaschgang 60°C', y: 142 },
                            { x: 'Pflegeleicht 40°C', y: 87 },
                            { x: 'Feinwäsche 30°C', y: 41 },
                            { x: 'Schleudern', y: 12.345 }
                        ]
                    }
                ]
            })

            // Dual value axis + mixed series types, horizontal.
            const dual = (orientation) => ({
                title: 'Dual axis',
                axis: {
                    timeseries: false,
                    orientation,
                    showLegend: true,
                    xAxisLabel: 'Station',
                    yAxisLabel: 'Temp',
                    yAxisLabelRight: 'Units'
                },
                dataseries: [
                    {
                        label: 'Temp',
                        type: 'bar',
                        yAxis: 'left',
                        styling: { showValueLabels: true },
                        data: [
                            { x: 'A', y: 21 },
                            { x: 'B', y: 34 },
                            { x: 'C', y: 28 }
                        ]
                    },
                    {
                        label: 'Units',
                        type: 'line',
                        yAxis: 'right',
                        styling: { showValueLabels: true, pointStyle: 'circle' },
                        data: [
                            { x: 'A', y: 2800 },
                            { x: 'B', y: 1000 },
                            { x: 'C', y: 5900 }
                        ]
                    }
                ]
            })

            const cases = [
                ['1. baseline default-data (unchanged config)', defaultData],
                ['2. vertical bars, no labels (today)', programs('vertical', false)],
                ['3. vertical bars + value labels', programs('vertical', true)],
                ['4. HORIZONTAL bars + value labels', programs('horizontal', true)],
                ['5. dual axis vertical + labels', dual('vertical')],
                ['6. dual axis HORIZONTAL + labels', dual('horizontal')]
            ]

            render(
                html`${cases.map(
                    ([label, data]) => html`
                        <div class="cell">
                            <h4>${label}</h4>
                            <div><${tag} .theme="${theme}" .inputData=${data}></${tag}></div>
                        </div>
                    `
                )}`,
                document.getElementById('demo')
            )
        </script>
    </body>
</html>
