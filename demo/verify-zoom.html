<!doctype html>
<html lang="en-GB">
    <head>
        <meta charset="utf-8" />
        <title>Linechart zoom-bar placement</title>
        <style>
            body {
                margin: 0;
                font-family: Helvetica, Arial, sans-serif;
                background: #f5f5f5;
            }
            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                padding: 8px;
            }
            .cell {
                background: #fff;
                height: 300px;
                display: flex;
                flex-direction: column;
            }
            .cell > h4 {
                margin: 4px 8px;
                font-size: 12px;
                color: #666;
            }
            .cell > div {
                flex: 1;
                min-height: 0;
            }
            .cell > div > * {
                display: block;
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <div class="grid" id="demo"></div>

        <script type="module">
            import { render } from 'lit'
            import { html, unsafeStatic } from 'lit/static-html.js'
            import packageJson from '../package.json'
            const tag = unsafeStatic(`widget-linechart-${packageJson.version}`)
            import '../src/widget-linechart.ts'
            import themeObject from './themes/light.json'
            const theme = { theme_name: 'light', theme_object: themeObject }

            // Non-numeric labels, so the x-axis is inferred as categorical
            // rather than as a numeric value axis.
            const pts = (n, f) =>
                Array.from({ length: n }, (_, i) => ({ x: `W${i + 1}`, y: f(i) }))

            const make = (type, zoom, extra = {}) => ({
                title: `${type} / zoom:${zoom}`,
                axis: {
                    timeseries: false,
                    xAxisZoom: zoom,
                    showLegend: true,
                    xAxisLabel: 'Year',
                    yAxisLabel: 'Value',
                    ...extra
                },
                dataseries: [
                    {
                        label: 'Series A',
                        type,
                        borderColor: '#4472c4',
                        backgroundColor: '#4472c4',
                        data: pts(12, (i) => 20 + ((i * 37) % 60))
                    }
                ]
            })

            // Long legend + zoom: the legend and the toolbox's restore button
            // both live in the top-right corner and can collide.
            const longLegend = {
                title: 'long legend / zoom:true',
                axis: { timeseries: false, xAxisZoom: true, showLegend: true, xAxisLabel: 'Year' },
                dataseries: ['Ausschuss gesamt', 'Gutteile gesamt', 'Nacharbeit gesamt'].map(
                    (label, s) => ({
                        label,
                        type: 'bar',
                        data: pts(12, (i) => 20 + ((i * (17 + s * 11)) % 60))
                    })
                )
            }

            const cases = [
                ['1. BAR, zoom OFF (baseline)', make('bar', false)],
                ['2. BAR, zoom ON  <-- reported', make('bar', true)],
                ['3. LINE, zoom ON (compare)', make('line', true)],
                ['4. BAR, zoom ON, horizontal', make('bar', true, { orientation: 'horizontal' })],
                ['5. long legend + zoom ON', longLegend],
                ['6. long legend + zoom OFF', { ...longLegend, axis: { ...longLegend.axis, xAxisZoom: false } }]
            ]

            render(
                html`${cases.map(
                    ([label, data]) => html`
                        <div class="cell">
                            <h4>${label}</h4>
                            <div><${tag} .theme="${theme}" .inputData=${data}></${tag}></div>
                        </div>
                    `
                )}`,
                document.getElementById('demo')
            )
        </script>
    </body>
</html>
